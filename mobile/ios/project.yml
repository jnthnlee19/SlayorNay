name: GlossOrToss
options:
  bundleIdPrefix: com.jnthnlee19
  deploymentTarget:
    iOS: '17.0'
targets:
  GlossOrToss:
    type: application
    platform: iOS
    sources:
      - GlossOrToss.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jnthnlee19.glossortoss
        PRODUCT_NAME: GlossOrToss
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gloss or Toss
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Take your own nail product photo to submit for review.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save product photos and Gloss or Toss share cards to your photo library.
