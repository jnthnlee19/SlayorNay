name: Upload iPhone build to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: TUNX5XS3UX
      APP_BUNDLE_ID: com.jnthnlee19.glossortoss
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check signing configuration
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          names = ['APPLE_API_KEY_P8', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER_ID',
                   'IOS_CERTIFICATE_BASE64', 'IOS_CERTIFICATE_PASSWORD', 'IOS_PROFILE_BASE64']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          PY
      - name: Prepare Xcode project
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
      - name: Install signing assets in temporary keychain
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, filename in [('IOS_CERTIFICATE_BASE64', 'got-signing.p12'), ('IOS_PROFILE_BASE64', 'got.mobileprovision')]:
              (root / filename).write_bytes(base64.b64decode(os.environ[name], validate=True))
          PY
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/got-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/got-signing.p12" -P "$IOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/got.mobileprovision" > "$RUNNER_TEMP/got-profile.plist"
          python3 - <<'PY'
          import datetime, os, pathlib, plistlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((root / 'got-profile.plist').read_bytes())
          team, bundle = os.environ['APPLE_TEAM_ID'], os.environ['APP_BUNDLE_ID']
          assert team in profile['TeamIdentifier'], 'Profile belongs to another Apple team'
          assert profile['Entitlements']['application-identifier'] == team + '.' + bundle, 'Wrong app profile'
          assert not profile['Entitlements'].get('get-task-allow'), 'A distribution profile is required'
          assert 'ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices'), 'An App Store profile is required'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile has expired'
          dest = pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          dest.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'got.mobileprovision', dest / (profile['UUID'] + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('IOS_PROFILE_UUID=' + profile['UUID'] + '\n')
          options = dict(method='app-store-connect', destination='export', signingStyle='manual',
                         teamID=team, signingCertificate='Apple Distribution',
                         provisioningProfiles={bundle: profile['UUID']}, manageAppVersionAndBuildNumber=False)
          (root / 'got-export.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Archive iPhone app
        run: |
          xcodebuild -project mobile/ios/GlossOrToss.xcodeproj -scheme GlossOrToss \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GlossOrToss.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive
      - name: Export signed app
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GlossOrToss.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/got-export.plist" -exportPath "$RUNNER_TEMP/got-export"
      - name: Upload to Apple for TestFlight processing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/got-api"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/got-api/AuthKey_${APPLE_API_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/got-api"
          xcrun altool --upload-app --type ios -f "$RUNNER_TEMP/got-export/GlossOrToss.ipa" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          echo 'Build uploaded. Apple must finish processing before TestFlight installation. No App Store review was submitted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/got-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/got-signing.p12" "$RUNNER_TEMP/got.mobileprovision" "$RUNNER_TEMP/got-profile.plist"
          rm -f "$RUNNER_TEMP"/got-api/AuthKey_*.p8
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
