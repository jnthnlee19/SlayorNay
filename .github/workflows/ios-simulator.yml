name: iPhone simulator build
on:
  workflow_dispatch:
    inputs:
      capture_screens:
        description: Capture optional simulator screenshots
        type: boolean
        default: false
  push:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-simulator.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build without Apple signing
        run: xcodebuild -project mobile/ios/GlossOrToss.xcodeproj -scheme GlossOrToss -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/GlossOrToss.app GlossOrToss-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GlossOrToss-simulator
          path: GlossOrToss-simulator.zip
          retention-days: 14

      - name: Capture iPhone preview screens
        if: github.event_name == 'workflow_dispatch' && inputs.capture_screens
        timeout-minutes: 12
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"] and "Pro Max" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/GlossOrToss.app
          mkdir -p screenshots
          for SECTION in vote discover submit profile; do
            xcrun simctl launch --terminate-running-process "$DEVICE" com.jnthnlee19.glossortoss --preview-section "$SECTION"
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "screenshots/$SECTION.png"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.capture_screens
        with:
          name: GlossOrToss-preview-screens
          path: screenshots/*.png
          retention-days: 14
