name: iPhone simulator build
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-simulator.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build without Apple signing
        run: xcodebuild -project mobile/ios/GlossOrToss.xcodeproj -scheme GlossOrToss -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/GlossOrToss.app GlossOrToss-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GlossOrToss-simulator
          path: GlossOrToss-simulator.zip
          retention-days: 14
